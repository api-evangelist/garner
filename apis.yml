aid: garner
name: Garner
description: >-
  Garner Health is a healthcare technology company that helps members find
  high-quality, in-network doctors while helping employers, advisors, health
  plans, and providers improve care quality and lower costs. Garner analyzes more
  than 60 billion de-identified medical records from 320M+ patients and applies
  550+ specialty-specific quality and efficiency metrics across 80+ specialties to
  identify Top Providers, delivered as an employer-funded benefit layered on top
  of existing insurance and as the Garner DataPro provider-recommendation data
  service. The Garner Health API (v1.x, OpenAPI 3.0.3) exposes ranked provider
  search, professional and facility directory detail, and provider-record
  annotation, authenticated with OAuth 2.0 client-credentials tokens.
